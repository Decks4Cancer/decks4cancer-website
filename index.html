<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Decks 4 Cancer</title>

    <style>
        body {
            margin: 0;
            background: #000000;
            color: #ffffff;
            font-family: Arial, sans-serif;
        }

        main {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 30px;
            box-sizing: border-box;
        }

        h1 {
            margin: 0;
            font-size: clamp(3rem, 10vw, 8rem);
            line-height: 0.9;
        }

        .decks {
            color: #00D7F2;
        }

        .four {
            color: #FF2DA6;
        }

        .cancer {
            color: #FFC107;
        }

        p {
            margin-top: 30px;
            font-size: clamp(1.1rem, 2vw, 1.6rem);
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
    </style>
</head>

<body>
    <main>
        <h1>
            <span class="decks">DECKS</span>
            <span class="four">4</span>
            <span class="cancer">CANCER</span>
        </h1>

        <p>Helping deck cancer in the face.</p>
    </main>
</body>
</html>
